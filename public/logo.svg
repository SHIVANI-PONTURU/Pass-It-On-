<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pass It On logo: the Moon and Mars" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="pio-sky" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#292524"/>
      <stop offset="0.6" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="pio-moon" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e7e5e4"/>
      <stop offset="0.85" stop-color="#a8a29e"/>
      <stop offset="1" stop-color="#78716c"/>
    </radialGradient>
    <radialGradient id="pio-mars" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="0.3" stop-color="#fb923c"/>
      <stop offset="0.65" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="pio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fed7aa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pio-dust" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fdba74" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d6d3d1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pio-shade" cx="32%" cy="30%" r="85%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="pio-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="pio-badge"><circle cx="100" cy="100" r="96"/></clipPath>
    <clipPath id="pio-moon-clip"><circle cx="76" cy="76" r="46"/></clipPath>
    <clipPath id="pio-mars-clip"><circle cx="128" cy="128" r="48"/></clipPath>
    <symbol id="pio-spark" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10 Z" fill="#fff"/>
    </symbol>
  </defs>

  <!-- Night sky badge -->
  <circle cx="100" cy="100" r="96" fill="url(#pio-sky)"/>
  <g clip-path="url(#pio-badge)">
    <!-- far stars -->
    <g fill="#fff">
      <circle cx="30" cy="140" r="1.1" opacity="0.8"/>
      <circle cx="48" cy="170" r="0.9" opacity="0.6"/>
      <circle cx="22" cy="110" r="0.8" opacity="0.7"/>
      <circle cx="150" cy="30" r="1.1" opacity="0.8"/>
      <circle cx="176" cy="62" r="0.9" opacity="0.7"/>
      <circle cx="130" cy="18" r="0.8" opacity="0.6"/>
      <circle cx="184" cy="96" r="1" opacity="0.6"/>
      <circle cx="70" cy="186" r="0.8" opacity="0.5"/>
      <circle cx="16" cy="78" r="0.9" opacity="0.5"/>
      <circle cx="96" cy="14" r="0.8" opacity="0.6"/>
    </g>
    <!-- warm dust cloud behind the planets -->
    <g filter="url(#pio-blur)">
      <ellipse cx="104" cy="100" rx="96" ry="30" transform="rotate(-45 104 100)" fill="#c2410c" opacity="0.28"/>
      <ellipse cx="100" cy="102" rx="74" ry="14" transform="rotate(-45 100 102)" fill="#e7e5e4" opacity="0.16"/>
    </g>

    <!-- stardust swirl, back half -->
    <path d="M -4 168 C 40 150 70 128 100 102 C 128 78 160 52 206 30" fill="none" stroke="url(#pio-dust)" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 4 186 C 50 160 80 136 104 108 C 132 82 166 62 210 50" fill="none" stroke="url(#pio-dust)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1 4" opacity="0.9"/>

    <!-- The Moon -->
    <circle cx="76" cy="76" r="46" fill="url(#pio-moon)"/>
    <g clip-path="url(#pio-moon-clip)">
      <!-- dark plains (maria) -->
      <path d="M48 58 C56 48 72 50 76 58 C80 66 70 72 60 70 C52 69 44 65 48 58 Z" fill="#78716c" opacity="0.45"/>
      <path d="M80 44 C90 40 102 46 100 56 C98 62 88 62 84 58 C79 54 75 47 80 44 Z" fill="#78716c" opacity="0.38"/>
      <path d="M58 84 C66 80 78 84 78 92 C78 100 66 104 58 98 C52 94 52 88 58 84 Z" fill="#78716c" opacity="0.35"/>
      <path d="M90 74 C98 70 108 76 106 84 C104 90 96 90 92 86 C88 82 86 77 90 74 Z" fill="#78716c" opacity="0.3"/>
      <!-- craters -->
      <g fill="none" stroke="#78716c" stroke-width="1.2" opacity="0.7">
        <circle cx="66" cy="106" r="5"/>
        <circle cx="96" cy="100" r="3.5"/>
        <circle cx="46" cy="86" r="3"/>
        <circle cx="70" cy="44" r="2.6"/>
        <circle cx="104" cy="64" r="2.4"/>
      </g>
      <g fill="#fff" opacity="0.8">
        <circle cx="65.2" cy="105" r="2"/>
        <circle cx="95.4" cy="99.3" r="1.4"/>
      </g>
      <!-- bright ray crater -->
      <g stroke="#ffffff" stroke-width="0.8" opacity="0.55" stroke-linecap="round">
        <line x1="66" y1="106" x2="52" y2="118"/>
        <line x1="66" y1="106" x2="82" y2="118"/>
        <line x1="66" y1="106" x2="58" y2="92"/>
        <line x1="66" y1="106" x2="80" y2="98"/>
      </g>
      <!-- night side shading -->
      <circle cx="76" cy="76" r="46" fill="url(#pio-shade)"/>
    </g>

    <!-- glow where the two worlds meet -->
    <circle cx="103" cy="103" r="26" fill="url(#pio-glow)"/>

    <!-- Mars -->
    <circle cx="128" cy="128" r="50" fill="#000" opacity="0.35"/>
    <circle cx="128" cy="128" r="48" fill="url(#pio-mars)"/>
    <g clip-path="url(#pio-mars-clip)">
      <!-- north polar cap -->
      <ellipse cx="124" cy="83" rx="15" ry="5" fill="#fff7ed" opacity="0.9"/>
      <!-- the long canyon across the middle -->
      <path d="M92 124 C104 118 116 122 128 120 C140 118 152 112 166 116 C156 122 142 124 130 128 C116 132 104 130 92 128 Z" fill="#7c2d12" opacity="0.7"/>
      <path d="M100 126 C112 124 126 126 140 122" fill="none" stroke="#fdba74" stroke-width="0.8" opacity="0.6"/>
      <!-- dark regions -->
      <path d="M104 98 C112 94 122 98 120 104 C118 110 108 110 104 106 C101 103 100 100 104 98 Z" fill="#9a3412" opacity="0.55"/>
      <path d="M136 140 C146 136 160 142 158 150 C156 158 144 160 138 154 C134 150 130 144 136 140 Z" fill="#7c2d12" opacity="0.5"/>
      <path d="M110 146 C116 144 122 148 120 152 C118 156 112 156 110 152 Z" fill="#9a3412" opacity="0.5"/>
      <!-- small craters and volcano -->
      <g fill="none" stroke="#7c2d12" stroke-width="1" opacity="0.6">
        <circle cx="150" cy="100" r="3"/>
        <circle cx="146" cy="164" r="2.6"/>
        <circle cx="98" cy="142" r="2.2"/>
      </g>
      <circle cx="112" cy="110" r="4" fill="#fed7aa" opacity="0.35"/>
      <!-- night side shading -->
      <circle cx="128" cy="128" r="48" fill="url(#pio-shade)"/>
    </g>

    <!-- stardust swirl, front half (wraps over the planets' edges) -->
    <path d="M 22 198 C 52 168 80 132 103 104" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.5 5" opacity="0.9"/>
    <g fill="#fff">
      <circle cx="58" cy="176" r="1.3" opacity="0.9"/>
      <circle cx="78" cy="156" r="1" opacity="0.8"/>
      <circle cx="88" cy="140" r="1.4" opacity="0.9"/>
      <circle cx="120" cy="92" r="1.1" opacity="0.9"/>
      <circle cx="150" cy="60" r="1.2" opacity="0.8"/>
      <circle cx="168" cy="46" r="0.9" opacity="0.7"/>
      <circle cx="40" cy="156" r="1" opacity="0.7"/>
      <circle cx="30" cy="164" r="0.8" opacity="0.6"/>
    </g>

    <!-- sparkles -->
    <use href="#pio-spark" x="98" y="94" width="20" height="20"/>
    <use href="#pio-spark" x="150" y="40" width="14" height="14"/>
    <use href="#pio-spark" x="28" y="138" width="12" height="12"/>
    <use href="#pio-spark" x="166" y="76" width="9" height="9" opacity="0.8"/>
    <use href="#pio-spark" x="40" y="24" width="10" height="10" opacity="0.8"/>
    <use href="#pio-spark" x="76" y="160" width="8" height="8" opacity="0.8"/>
  </g>

  <!-- badge ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#fb923c" stroke-width="2.5" opacity="0.85"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.25"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
